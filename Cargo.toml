[workspace]
resolver = "2"
members = [
    "crates/coheret",
    "crates/coheret-docker",
    "crates/coheret-probe",
    "crates/coheret-supervisor",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
homepage = "https://github.com/coheret/coheret"
repository = "https://github.com/coheret/coheret"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
colored = "2"
dirs = "5"
ureq = "2"
serde_yaml = "0.9"

coheret-docker = { path = "crates/coheret-docker", version = "0.2.0" }
coheret-probe = { path = "crates/coheret-probe", version = "0.2.0" }
coheret-supervisor = { path = "crates/coheret-supervisor", version = "0.2.0" }
