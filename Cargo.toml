[package]
name = "coheret"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "CLI for Docker container health monitoring, cron-scheduled restarts, and auto-healing"
license = "MIT"
homepage = "https://github.com/coheret/coheret"
repository = "https://github.com/coheret/coheret"
readme = "README.md"
keywords = ["docker", "containers", "cli", "health", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
colored = "2"
dirs = "5"
